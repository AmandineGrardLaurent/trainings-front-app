<main class="flex flex-row gap-4 justify-center">
  <div>
    <app-training-list
      [trainings]="trainings"
      (deleteTraining)="onDeleteTraining($event)"
    ></app-training-list>
    @if (users.length > 0) {
      <app-user-list [users]="users" (deleteUser)="onDeleteUser($event)"></app-user-list>
    }
  </div>
</main>
