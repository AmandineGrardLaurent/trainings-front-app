@if (userValue) {
  <div class="p-6 my-6 max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-gray-200">
    <h2 class="text-3xl font-bold mb-4 text-pink-500">Bonjour {{ userValue.name }}</h2>
    <p class="text-gray-700 mb-4">
      Bienvenue sur votre page de profil. Ici, vous pouvez consulter vos informations personnelles
      enregistrées.
    </p>

    <div class="space-y-2">
      <p class="flex justify-between bg-gray-50 p-2 rounded">
        <span class="font-semibold text-gray-600">Nom:</span>
        <span class="text-gray-800">{{ userValue.name }}</span>
      </p>
      <p class="flex justify-between bg-gray-50 p-2 rounded">
        <span class="font-semibold text-gray-600">Email:</span>
        <span class="text-gray-800">{{ userValue.email }}</span>
      </p>
    </div>

    <button (click)="logout()" class="text-pink-400 hover:text-pink-500 font-medium m-3">
      Se déconnecter
    </button>
  </div>
} @else {
  <p class="text-gray-500 italic mt-4 text-center">Veuillez vous connecter !!</p>
}
